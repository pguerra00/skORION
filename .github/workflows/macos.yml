name: macOS desktop icons

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  icons:
    runs-on: macos-latest
    timeout-minutes: 15
    env:
      QT_QPA_PLATFORM: cocoa
    steps:
      - uses: actions/checkout@v4
        with:
          path: 'scikit ORION μ'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install desktop dependencies
        working-directory: 'scikit ORION μ'
        run: python -m pip install -r requirements.txt
      - name: Check native desktop icons and portable resources
        working-directory: 'scikit ORION μ'
        run: python -m unittest discover -s tests -p test_app_icon.py -v
